name: Windows Lab ACP Reply Hotfix

# Rebuild only buzz-acp.exe after restoring the managed-agent reply permission.
# The desktop, CLI, and other sidecars are reused from the already-audited
# portable hotfix.1 package when this patch artifact is assembled locally.
on:
  push:
    branches:
      - build/lab-windows-canary

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Lab ACP reply hotfix
    if: github.repository == 'oigorbastos/buzz' && github.ref == 'refs/heads/build/lab-windows-canary'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TARGET: x86_64-pc-windows-msvc
      LAB_BASE_SHA: 88da732c22991dbf66c2fee4b527e04818401f4e
      SOURCE_SHA: ${{ github.sha }}
      BUILD_WORKFLOW_SHA: ${{ github.sha }}

    steps:
      - name: Require fork, branch, and complete source SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "oigorbastos/buzz" ]] || {
            echo "::error::This build is restricted to oigorbastos/buzz" >&2
            exit 1
          }
          [[ "$GITHUB_REF" == "refs/heads/build/lab-windows-canary" ]] || {
            echo "::error::This build is restricted to build/lab-windows-canary" >&2
            exit 1
          }
          [[ "$LAB_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::LAB_BASE_SHA must be a complete feature commit SHA" >&2
            exit 1
          }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::SOURCE_SHA must be a complete commit SHA" >&2
            exit 1
          }
          [[ "$BUILD_WORKFLOW_SHA" == "$SOURCE_SHA" ]] || {
            echo "::error::Workflow SHA and source SHA differ" >&2
            exit 1
          }

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable Lab source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || {
            echo "::error::Checked-out commit does not equal SOURCE_SHA" >&2
            exit 1
          }
          git merge-base --is-ancestor "$LAB_BASE_SHA" "$SOURCE_SHA" || {
            echo "::error::Canary source must descend from LAB_BASE_SHA" >&2
            exit 1
          }
          mapfile -t changed_files < <(git diff --name-only "$LAB_BASE_SHA" "$SOURCE_SHA")
          [[ "${#changed_files[@]}" -eq 1 && "${changed_files[0]}" == ".github/workflows/windows-lab-preview.yml" ]] || {
            echo "::error::Relative to LAB_BASE_SHA, canary may change only the preview workflow" >&2
            printf '%s\n' "${changed_files[@]}" >&2
            exit 1
          }

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ env.TARGET }}
          components: rustfmt

      - name: Verify Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          [[ "$(rustc --version)" == rustc\ 1.95.0* ]] || {
            echo "::error::Expected Rust 1.95.0" >&2
            exit 1
          }

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: .
          key: windows-lab-sidecars
          save-if: ${{ github.ref == 'refs/heads/build/lab-windows-canary' }}

      - name: Rust format check
        shell: bash
        run: cargo fmt --all -- --check

      - name: Buzz ACP tests
        shell: bash
        run: cargo test --target "$TARGET" -p buzz-acp

      - name: Build only the ACP Windows executable
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target "$TARGET" -p buzz-acp
          test -f "target/${TARGET}/release/buzz-acp.exe"

      - name: Package ACP patch with provenance and hashes
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_ROOT="$RUNNER_TEMP/buzz-lab-windows-sidecar-hotfix"
          rm -rf "$ARTIFACT_ROOT"
          mkdir -p "$ARTIFACT_ROOT"
          cp "target/${TARGET}/release/buzz-acp.exe" "$ARTIFACT_ROOT/buzz-acp.exe"

          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          cat > "$ARTIFACT_ROOT/BUILD-MANIFEST.txt" <<EOF
          LAB_BASE_SHA=$LAB_BASE_SHA
          SOURCE_SHA=$SOURCE_SHA
          BUILD_WORKFLOW_SHA=$BUILD_WORKFLOW_SHA
          BUILD_WORKFLOW_FILE=.github/workflows/windows-lab-preview.yml
          GITHUB_REPOSITORY=$GITHUB_REPOSITORY
          GITHUB_REF=$GITHUB_REF
          GITHUB_RUN_ID=$GITHUB_RUN_ID
          GITHUB_RUN_URL=$RUN_URL
          TARGET=$TARGET
          RUST=1.95.0
          CARGO_FMT=cargo fmt --all -- --check
          ACP_TEST=cargo test --target $TARGET -p buzz-acp
          RELEASE_BUILD=cargo build --release --target $TARGET -p buzz-acp
          INCLUDED_FILES=buzz-acp.exe
          ARTIFACT_RETENTION_DAYS=7
          EOF

          (
            cd "$ARTIFACT_ROOT"
            sha256sum buzz-acp.exe BUILD-MANIFEST.txt > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          ls -lh "$ARTIFACT_ROOT"
          cat "$ARTIFACT_ROOT/BUILD-MANIFEST.txt"
          cat "$ARTIFACT_ROOT/SHA256SUMS.txt"
          echo "root=$ARTIFACT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Upload ACP reply patch (7 days)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: buzz-lab-windows-acp-reply-hotfix-${{ github.sha }}
          path: ${{ steps.package.outputs.root }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
