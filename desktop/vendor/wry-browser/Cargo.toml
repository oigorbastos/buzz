[package]
name = "wry"
version = "0.56.1"
authors = ["Tauri Programme within The Commons Conservancy"]
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0 OR MIT"
description = "Windows-only audited Wry child for Buzz Web Workspace"
repository = "https://github.com/tauri-apps/wry"
build = "build.rs"

[workspace]

[lib]
name = "wry"
path = "src/lib.rs"

[features]
default = []
devtools = []
linux-body = []
mac-proxy = []
os-webview = []
serde = ["dpi/serde"]
tracing = ["dep:tracing"]
x11 = []

[dependencies]
cookie = "0.18"
dpi = "0.1"
http = "1.1"
once_cell = "1"
raw-window-handle = { version = "0.6", features = ["std"] }
serde_json = "1"
thiserror = "2.0"
tracing = { version = "0.1", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
dunce = "1"
webview2-com = "0.38"
windows-core = "0.61"
windows-version = "0.1"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(linux)", "cfg(gtk)"]
